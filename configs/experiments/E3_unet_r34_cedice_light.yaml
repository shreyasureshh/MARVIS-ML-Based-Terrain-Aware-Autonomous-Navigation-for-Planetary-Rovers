name: E3_unet_r34_cedice_light
# Imbalance: weighted CE + soft Dice vs E1
arch: unet
encoder: resnet34
loss: ce_dice
aug: light
image_size: 256
batch_size: 8
lr: 0.0005
weight_decay: 0.0001
dropout: 0.2
class_weight_power: 0.5
seed: 0
num_workers: 2
threads: 4
epochs: 8   # PROVISIONAL: set after `scripts/run.sh bench` times one real epoch
early_stopping_patience: 3
device: auto
